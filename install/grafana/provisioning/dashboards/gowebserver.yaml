# Loads the dashboards in ../../dashboards into a gowebserver folder.
# Mount this file into /etc/grafana/provisioning/dashboards and the
# dashboards at the path below.

apiVersion: 1

providers:
  - name: gowebserver
    orgId: 1
    folder: gowebserver
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards/gowebserver
