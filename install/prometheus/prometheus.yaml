# An example Prometheus configuration that scrapes gowebserver and loads
# its alerts. The alerts and dashboards select job="gowebserver", so keep
# that job name, or change it in rules/ and pick it in the dashboards.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - rules/*.yaml

# Where firing alerts are sent. Without an Alertmanager they are still
# listed on Prometheus's own Alerts page.
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: gowebserver
    # -monitoring.metrics.path, /metrics unless changed.
    metrics_path: /metrics
    static_configs:
      - targets:
          - gowebserver:8080
