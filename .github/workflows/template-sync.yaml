name: Sync template-go

# Pull the template-managed files of a project created from this template
# back up to the current upstream versions: the Makefile_*.mk includes,
# the root dotfile configs and the whole .github/ directory. All of that
# is done by scripts/template-go/sync-template.sh, which is safe to re-run and
# converges on the upstream tree, so this workflow only has to run it and
# turn whatever it changed into a pull request. If the sync changes
# nothing there is nothing to commit and no pull request is opened.
#
# This file ships inside the template, so the sync propagates it to every
# repo created from it (it replaces the whole .github/ directory) - and
# those repos are the only place it has work to do. See the job's "if:"
# below for why it deliberately does nothing inside template-go itself.
#
# GitHub only runs "schedule:" triggers from the default branch, and
# delays scheduled runs on private repos at peak times, so the time below
# is approximate. workflow_dispatch allows an on-demand run of the job.
on:
  schedule:
    # 22:00 UTC on Friday - Friday night, and late enough in the day that
    # a same-day dependency PR (see dependency-update.yaml) has already
    # been reviewed, or at least seen, before the template files move
    # underneath it.
    - cron: "0 22 * * 5"
  workflow_dispatch:

concurrency:
  # Deliberately not cancel-in-progress: a run killed after it has pushed
  # leaves a half-synced PR branch for the next run to fight over.
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    name: "Sync template-managed files"
    # No pull request inside template-go itself. The sync replaces the
    # managed files with a clone of template-go's main branch, so in this
    # repo that is a no-op on main and a clobber of in-progress work on
    # any other ref - either way there is no PR worth opening. Every
    # other repo that runs this workflow consumes the template and does
    # want the PR.
    if: github.repository != 'cloudfra/template-go'
    # Standard GitHub-hosted runner rather than this repo's self-hosted
    # "large" fleet: the job clones the template and diffs files, so it
    # has no business occupying the build runners.
    runs-on: ubuntu-latest
    # contents: write pushes the sync branch, pull-requests: write opens
    # the PR. Nothing here merges, so the result still goes through
    # review - which matters, because the sync is a hard replace.
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 10
    steps:
      - name: Checkout code
        # https://github.com/actions/checkout
        # Default fetch depth: unlike dependency-update.yaml, this job
        # never compares against a tag or an older commit - the sync
        # clones the template itself and only touches the working tree.
        uses: actions/checkout@v7
      - name: Sync template files
        env:
          # The script's default upstream is an SSH URL, which a hosted
          # runner has no key for. It is also the template's URL in every
          # consumer project, so pin it rather than deriving it from
          # github.repository, which is the consuming repo here.
          TEMPLATE_GO_REPO: https://github.com/cloudfra/template-go.git
        # No --dry-run: the changes are wanted, they just go through a
        # pull request instead of being merged automatically.
        run: ./scripts/template-go/sync-template.sh
      - name: Open pull request
        # https://github.com/peter-evans/create-pull-request
        # A no-op when the sync changed nothing: the action only opens a
        # PR when there is something to commit.
        # PRs opened with GITHUB_TOKEN don't start workflow runs
        # (GitHub's recursion guard), so CI doesn't fire on this PR by
        # itself - close and reopen it to run CI.
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          base: main
          # One reused branch: each scheduled run updates the open PR in
          # place instead of stacking another one on top of it.
          # delete-branch cleans the branch up once the PR merges.
          branch: chore/sync-template
          delete-branch: true
          commit-message: "chore: sync template-managed files"
          title: "chore: sync template-managed files"
          # Deliberately no add-paths (unlike dependency-update.yaml):
          # the sync both adds and deletes files across a set that
          # includes every root dotfile, and this job runs nothing but
          # the sync, so the whole working-tree diff is the sync result.
          # The default "." stages additions, edits and deletions
          # without enumerating the managed set.
          # Same convention: the PR body is a file in the repo, not a
          # YAML block scalar in this workflow.
          body-path: .github/template-sync-pr-body.md
