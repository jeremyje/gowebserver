name: Update Dependencies

# Periodic refresh of everything this repo pins: the tool versions in the
# Makefile_*.mk files, the terraform provider pins under install/terraform,
# the vendored protos under third_party, and the Go modules in go.mod
# (moved through this repo's own "make deps" target). All of that lives in
# scripts/template-go/update-project.sh, which updates every one of those
# areas in a single pass, so a scheduled run resolves versions exactly the way
# a local run does and no area is left lagging a day behind another.
#
# GitHub only runs "schedule:" triggers from the default branch, and delays
# scheduled runs on private repos at peak times, so the time below is
# approximate. workflow_dispatch allows an on-demand run of the same job.
on:
  schedule:
    # 09:00 UTC on Wednesday, Friday and Saturday. Three spread-out days
    # rather than every day: enough that a pin is never more than a few days
    # stale, without a PR churn on days nothing has changed.
    - cron: "0 9 * * 3,5,6"
  workflow_dispatch:

concurrency:
  # Deliberately not cancel-in-progress: a run killed after it has pushed
  # leaves a half-updated PR branch for the next run to fight over.
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    name: "Update dependencies"
    # Standard GitHub-hosted runner rather than this repo's self-hosted
    # "large" fleet: the job is network-bound (version lookups plus the
    # ~26 MB of vendored archives the third_party step re-downloads), so it
    # has no business occupying the build runners.
    runs-on: ubuntu-latest
    # contents: write pushes the update branch, pull-requests: write opens
    # the PR. Nothing here merges, so the result still goes through review.
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 30
    steps:
      - name: Checkout code
        # https://github.com/actions/checkout
        # fetch-depth: 0 because update-project.sh compares HEAD against
        # the newest upstream tag, and a shallow clone has no merge base to
        # compare with.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Go
        # https://github.com/actions/setup-go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Update dependencies
        env:
          # Raises the GitHub API budget the version lookups spend from the
          # shared runner IP's unauthenticated 60/hour to the per-run limit.
          GITHUB_TOKEN: ${{ github.token }}
          # The script's default upstream is an SSH URL, which a hosted
          # runner has no key for. actions/checkout leaves a token-backed
          # https remote behind, so sync over https instead.
          TEMPLATE_GO_REPO: https://github.com/${{ github.repository }}.git
        run: ./scripts/template-go/update-project.sh
      - name: Select paths to commit
        id: paths
        # Mirrors the set of paths update-project.sh writes to. Keeping it
        # explicit stops build leftovers from landing in the PR, and keeps
        # the diff reviewable. "go.*" covers go.mod plus go.sum, which
        # "make deps" rewrites in checkouts that have module requirements
        # (this template's go.mod has none, so no go.sum exists here).
        # Not every project has every path (e.g. no install/terraform/),
        # and create-pull-request's single `git add` stages nothing at all
        # when one pathspec matches no file, so the list is filtered down
        # to the pathspecs that exist in this checkout first.
        run: ./scripts/template-go/existing-pathspecs.sh "Makefile*.mk,install/terraform/*.tf,third_party/,go.*"
      - name: Open pull request
        # https://github.com/peter-evans/create-pull-request
        # PRs opened with GITHUB_TOKEN don't start workflow runs (GitHub's
        # recursion guard), so the CI workflow doesn't fire on this PR by
        # itself - close and reopen it to run CI.
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          base: main
          # One reused branch: each scheduled run updates the open PR in
          # place instead of stacking another one on top of it.
          # delete-branch cleans the branch up once the PR merges.
          branch: chore/periodic-dependency-update
          delete-branch: true
          commit-message: "chore: update dependencies"
          title: "chore: update dependencies"
          # Comma-separated rather than a block scalar: workflow YAML in this
          # repo stays free of inline multi-line payloads (see "GitHub
          # Actions workflows" in CONTRIBUTING.md). The list itself is in
          # the "Select paths to commit" step above.
          add-paths: ${{ steps.paths.outputs.paths }}
          # Same convention: the PR body is a file in the repo, not a YAML
          # block scalar in this workflow.
          body-path: .github/dependency-update-pr-body.md
